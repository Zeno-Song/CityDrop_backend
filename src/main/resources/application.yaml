spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/citydrop
    username: postgres
    password: secret
  data:
    redis:
      host: localhost
      port: 6379
  sql:
    init:
      mode: always
google:
  maps:
    api-key: AIzaSyAvpxIVG_1mmxomGEWl-3tw90rpowxkKos
openai:
  # Feature 4 (AI Customer Support): set OPENAI_API_KEY in your environment,
  # never commit it. Chat requests fail with a clear 503 (ChatUnavailableException)
  # if it's unset, instead of the app refusing to start.
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

citydrop:
  cache:
    quote-lock-ttl: 5m
    geocode-ttl: 24h
    travel-time-ttl: 15m
